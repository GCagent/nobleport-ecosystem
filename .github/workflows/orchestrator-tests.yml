name: Orchestrator Tests

on:
  pull_request:
    paths:
      - "nobleport-systems/orchestrator/**"
      - "nobleport-systems/docker-compose.yml"
      - ".github/workflows/orchestrator-tests.yml"
  push:
    branches:
      - main
      - feature/stephanie-voicebox-pilot
    paths:
      - "nobleport-systems/orchestrator/**"
      - "nobleport-systems/docker-compose.yml"
      - ".github/workflows/orchestrator-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nobleport-systems/orchestrator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nobleport-systems/orchestrator/pyproject.toml

      - name: Install orchestrator
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q
