[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobleport-orchestrator"
version = "0.1.0"
description = "NoblePort Systems orchestrator: module registry, workflow engine, agents, human gate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["nobleport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
